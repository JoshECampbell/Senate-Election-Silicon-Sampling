project:
  type: website
  output-dir: .
  # Fetch the public benchmark, then prepare figures from saved data.
  pre-render:
    - uv run --offline --frozen python ../src/polling_forecast.py --fetch
    - uv run --offline --frozen python ../src/prepare_website.py
  render:
    - index.qmd
  resources:
    - assets/**
    - data/**
    - figures/**
    - .nojekyll
    - "!design/**"

website:
  title: "The Synthetic Electorate"

format:
  html:
    theme: none
    css: styles.css
    toc: false
    anchor-sections: false
    page-layout: custom
    title-block-style: none
    include-after-body: components/_scripts.html
    html-math-method: plain

execute:
  enabled: false

lang: en
