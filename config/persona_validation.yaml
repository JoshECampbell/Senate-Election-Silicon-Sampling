# Settings for src/validate_personas.py. CLI options can override these values.
# Exactly the characteristics in query_config.yaml's 11-characteristic persona.
features: [race, gender4, inputstate, educ, religpew, marstat, sexuality, votereg, faminc_new, pid7, ideo5]

# Estimate age in the CES survey year, not the year when this script runs.
age_reference_year: 2025
# Lower bounds are inclusive. Upper bounds are exclusive: 18-29, 30-44, etc.Chosen based on Xbox paper 
age_bin_edges: [18, 30, 45, 65, 121]

# Keep uncertainty and refusal responses as separate categories.
# Combine only these response labels and actual nulls into "No response".
no_response_labels: [Skipped, Not Asked]
